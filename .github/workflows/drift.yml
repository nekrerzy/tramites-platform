# Detección de drift: `terraform plan` programado contra el estado remoto de infra/platform.
# Si alguien cambió algo en la consola, el plan sale con código 2 y se abre (o actualiza)
# un issue con la etiqueta "drift". Usa la cuenta gha-drift, de solo lectura.
name: drift

on:
  schedule:
    # Lunes a viernes 14:00 UTC (08:00 hora del centro de México), inicio del horario hábil.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # token OIDC para WIF
  issues: write # abrir/comentar el issue de drift

concurrency:
  group: drift
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/platform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DRIFT_SA }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false # necesitamos el código de salida real de plan

      - run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # -lock=false: la cuenta es de solo lectura y no puede escribir el lock en el bucket.
      # -detailed-exitcode: 0 = sin cambios, 1 = error, 2 = hay diferencias (drift).
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -refresh=true -detailed-exitcode -no-color -out=drift.tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 1 ]; then exit 1; fi
          if [ "${code}" -eq 2 ]; then
            terraform show -no-color drift.tfplan > drift.txt
          fi

      - name: Abrir o actualizar issue de drift
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Drift detectado en \`infra/platform\` ($(date -u +%Y-%m-%dT%H:%MZ)). Run: ${RUN_URL}"
            echo
            echo "Corregir: revertir el cambio en la consola, o llevarlo al código con un PR y \`terraform apply\`."
            echo
            echo '```'
            head -c 60000 drift.txt
            echo '```'
          } > body.md
          gh label create drift --color B60205 --description "Diferencias entre Terraform y GCP" 2>/dev/null || true
          issue="$(gh issue list --label drift --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "${issue}" ]; then
            gh issue comment "${issue}" --body-file body.md
          else
            gh issue create --title "Drift de infraestructura detectado" --label drift --body-file body.md
          fi
          echo "::warning::Drift detectado; ver issue con etiqueta drift"

      # El run queda en rojo: GitHub notifica por correo los workflows programados que fallan.
      - name: Fallar si hay drift
        if: steps.plan.outputs.exitcode == '2'
        run: exit 1
