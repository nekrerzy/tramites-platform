# CI: revisa cada PR a main. La protección de main exige estos checks en verde (y la rama al
# día con main) para fusionar, así que lo que llega a main ya pasó por aquí: deploy.yml no
# repite estas pruebas. No toca GCP: no necesita credenciales.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    name: docker build (non-root + vulnerabilidades)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t tramites-api:ci app
      - name: La imagen no corre como root
        run: test "$(docker run --rm tramites-api:ci id -u)" != "0"
      # Escanea la misma imagen (paquetes del SO y dependencias Python). Falla solo con HIGH o
      # CRITICAL que ya tienen parche: lo que no se puede arreglar no bloquea el PR.
      # Trivy fue comprometido en mar-2026 (v0.69.4-0.69.6): se fija por digest una versión
      # posterior y corre aislado, sin socket de Docker y en un job sin credenciales.
      - name: Escaneo de vulnerabilidades (Trivy)
        run: |
          docker save tramites-api:ci -o image.tar
          docker run --rm -v "${PWD}/image.tar:/scan/image.tar:ro" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --input /scan/image.tar --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
      - run: terraform fmt -check -recursive
      - name: validate (sin backend ni credenciales)
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # escanea todo el historial, no solo el último commit
      - name: gitleaks
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
