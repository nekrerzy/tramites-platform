# Despliegue continuo: corre cuando ci.yml termina en verde sobre un push a main (CI -> CD).
# Construye la imagen del commit que ci probó, la publica con versión SemVer + SHA, firma su
# digest para Binary Authorization y la despliega en Cloud Run por digest. Autenticación con
# Workload Identity Federation (sin llaves JSON); la cuenta gha-deployer solo puede ser usada
# por ESTE workflow en main (ver service_accounts.tf). workflow_run siempre corre la versión
# de este archivo en main, así que el claim workflow_ref sigue siendo deploy.yml@refs/heads/main.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # token OIDC para WIF

# Nunca dos despliegues a la vez; el segundo espera (no se cancela a medias).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  # El commit que ci probó (no el último de main, que pudo avanzar mientras ci corría).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # Solo ci en verde de un push a este mismo repo: nunca de un PR (ni de un fork con una
    # rama llamada main), y nunca si ci falló o se canceló.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0 # para comparar contra el commit que está desplegado

      - name: Calcular versión e imagen
        id: meta
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("app/pyproject.toml","rb"))["project"]["version"])')"
          # SemVer de pyproject.toml + SHA corto: única por commit (las etiquetas son inmutables).
          tag="${version}-${DEPLOY_SHA::7}"
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${{ vars.AR_REPOSITORY }}/tramites-api"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Imagen: ${image}:${tag}"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "588.0.0"
          install_components: beta

      # workflow_run no soporta `paths`: se compara contra lo que corre HOY en Cloud Run (el SHA
      # que reporta /health), no contra el commit anterior. Así un despliegue fallido o un push
      # con varios commits no deja cambios de app/ sin desplegar. Manual = siempre despliega.
      - name: ¿Cambió app/ desde la versión desplegada?
        id: changes
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)' || true)"
          deployed="$(curl -fsS --retry 3 "${url}/health" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"].rsplit("-", 1)[-1])' 2>/dev/null || true)"
          echo "Desplegado: ${deployed:-desconocido}"
          # Ante cualquier duda (versión ilegible, SHA que no existe) se despliega igual.
          if [ -n "${deployed}" ] && git diff --quiet "${deployed}" "${DEPLOY_SHA}" -- app .github/workflows/deploy.yml; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin cambios en app/ desde ${deployed}; no se despliega."
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir y publicar imagen
        id: image
        if: steps.changes.outputs.app == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg "APP_VERSION=${TAG}" -t "${IMAGE}:${TAG}" app
          docker push "${IMAGE}:${TAG}"
          # De aquí en adelante solo se usa el digest: lo que se firma es lo que se despliega.
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          echo "ref=${digest_ref}" >> "$GITHUB_OUTPUT"
          echo "Digest: ${digest_ref}"

      - name: Firmar digest (atestación de Binary Authorization)
        if: steps.changes.outputs.app == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --artifact-url="${IMAGE_REF}" \
            --attestor="${{ vars.BINAUTHZ_ATTESTOR }}" \
            --keyversion="${{ vars.KMS_KEY_VERSION }}" \
            --validate # falla aquí si la firma no verifica contra el attestor

      - name: Desplegar en Cloud Run por digest
        if: steps.changes.outputs.app == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE_REF}" \
            --region="${REGION}" \
            --quiet

      - name: Smoke test de /health
        if: steps.changes.outputs.app == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          url="$(gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)' || true)"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${url}/health" | tee health.json
          grep -q "\"version\":\"${TAG}\"" health.json
