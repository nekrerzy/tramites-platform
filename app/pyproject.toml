[project]
name = "tramites-api"
# La versión SemVer se usa para etiquetar la imagen en el pipeline (deploy.yml).
version = "0.1.0"
description = "API mínima de consulta de estado de trámites ciudadanos."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false
# Solo versiones publicadas antes de esta fecha: evita adoptar un release de horas de antigüedad
# (ventana para que se detecten paquetes comprometidos). Se mueve a mano al actualizar.
exclude-newer = "2026-10-12T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma normal de pytest; las claves de prueba no son secretos reales.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
